server.port=8081
spring.application.name=beadando
spring.thymeleaf.cache=false

# --- Készítők (minden oldal alján megjelenik) ---
app.authors=Nyemetz Zsolt (CDP0JC), Farkas Balazs (CZCVPS)

# --- Oanda DEMO (practice) fiók: ide írd a saját adataidat ---
oanda.url=https://api-fxpractice.oanda.com
oanda.token=IDE_ÍRD_AZ_OANDA_TOKENT
oanda.account-id=IDE_ÍRD_A_SZÁMLAAZONOSÍTÓT

# --- MNB webszolgáltatás ---
mnb.url=http://www.mnb.hu/arfolyamok.asmx

# --- React/H2 bónusz: fájlba mentett H2 adatbázis a c:\data mappában ---
spring.datasource.url=jdbc:h2:file:C:/data/beadando
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
# induláskor mintaadatok betöltése, ha a tábla üres
app.seed=true
