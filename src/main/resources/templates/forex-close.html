<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-Zár')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h2 class="mb-3">Forex – pozíció zárása</h2>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${result}" th:text="${result}"></div>
    <form method="post" th:action="@{/forex/close}" class="row g-3 align-items-end mb-4">
        <div class="col-md-4">
            <label class="form-label" for="tradeId">tradeId</label>
            <input type="number" min="1" class="form-control" id="tradeId" name="tradeId" required>
        </div>
        <div class="col-md-3"><button class="btn btn-danger w-100" type="submit">Zárás piaci áron</button></div>
    </form>
    <h5>Nyitott ügyletek</h5>
    <div class="table-responsive" th:if="${trades != null and !trades.isEmpty()}">
        <table class="table table-striped table-sm">
            <thead><tr><th>tradeId</th><th>Instrumentum</th><th>Egység</th><th>Nyitóár</th><th>Nyitás ideje</th><th>Nem realizált P/L</th></tr></thead>
            <tbody>
            <tr th:each="t : ${trades}">
                <td th:text="${t.id}"></td><td th:text="${t.instrument}"></td><td th:text="${t.units}"></td>
                <td th:text="${t.price}"></td><td th:text="${t.openTime}"></td><td th:text="${t.unrealizedPl}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="alert alert-info" th:if="${trades != null and trades.isEmpty()}">Nincs nyitott ügylet.</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
