<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – Java beadandó'">Java beadandó</title>
    <!-- Ingyenes reszponzív téma: Bootswatch "Lux" (Bootstrap 5) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Java beadandó</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Menü">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Főoldal</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/soap}">SOAP</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/teszt}">Teszt</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/react/index.html}">React</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Forex</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/forex/account}">Forex-account</a></li>
                        <li><a class="dropdown-item" th:href="@{/forex/price}">Forex-AktÁr</a></li>
                        <li><a class="dropdown-item" th:href="@{/forex/hist}">Forex-HistÁr</a></li>
                        <li><a class="dropdown-item" th:href="@{/forex/open}">Forex-Nyit</a></li>
                        <li><a class="dropdown-item" th:href="@{/forex/positions}">Forex-Poz</a></li>
                        <li><a class="dropdown-item" th:href="@{/forex/close}">Forex-Zár</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer text-center text-body-secondary">
    <div class="container">
        <small>Készítették: <span th:text="${@environment.getProperty('app.authors')}">Név (NEPTUN)</span></small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
