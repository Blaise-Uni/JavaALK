<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-AktÁr')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h2 class="mb-3">Forex – aktuális ár</h2>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="get" th:action="@{/forex/price}" class="row g-3 align-items-end mb-4">
        <div class="col-md-4">
            <label class="form-label" for="instrument">Instrumentum</label>
            <select class="form-select" id="instrument" name="instrument">
                <option th:each="i : ${instruments}" th:value="${i}" th:text="${i}" th:selected="${i == selected}"></option>
            </select>
        </div>
        <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Ár lekérdezése</button></div>
    </form>
    <div class="card" style="max-width: 480px" th:if="${price != null}">
        <div class="card-body">
            <h5 class="card-title" th:text="${price.instrument}"></h5>
            <p class="mb-1">Vételi ár (bid): <strong th:text="${price.bid}"></strong></p>
            <p class="mb-1">Eladási ár (ask): <strong th:text="${price.ask}"></strong></p>
            <p class="mb-1">Státusz: <span th:text="${price.status}"></span></p>
            <small class="text-body-secondary" th:text="${price.time}"></small>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
