<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-Poz')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h2 class="mb-3">Forex – nyitott pozíciók</h2>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="table-responsive" th:if="${positions != null and !positions.isEmpty()}">
        <table class="table table-striped">
            <thead><tr><th>Instrumentum</th><th>Long egység</th><th>Short egység</th><th>Nem realizált P/L</th></tr></thead>
            <tbody>
            <tr th:each="p : ${positions}">
                <td th:text="${p.instrument}"></td><td th:text="${p.longUnits}"></td>
                <td th:text="${p.shortUnits}"></td><td th:text="${p.unrealizedPl}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="alert alert-info" th:if="${positions != null and positions.isEmpty()}">Nincs nyitott pozíció.</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
