<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-Nyit')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h2 class="mb-3">Forex – pozíció nyitása piaci áron</h2>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${result}" th:text="${result}"></div>
    <form method="post" th:action="@{/forex/open}" class="row g-3 align-items-end mb-4">
        <div class="col-md-4">
            <label class="form-label" for="instrument">Instrumentum</label>
            <select class="form-select" id="instrument" name="instrument">
                <option th:each="i : ${instruments}" th:value="${i}" th:text="${i}" th:selected="${i == selected}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="units">Mennyiség (+ Long, – Short)</label>
            <input type="number" step="1" class="form-control" id="units" name="units"
                   th:value="${units != null ? #numbers.formatInteger(units, 1) : 100}" required>
        </div>
        <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Pozíció nyitása</button></div>
    </form>
    <p class="text-body-secondary">Demószámlán történik, valódi pénz nélkül.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
