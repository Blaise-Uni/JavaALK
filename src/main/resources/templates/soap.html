<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SOAP')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h2 class="mb-3">MNB árfolyamok (SOAP)</h2>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/soap}" class="row g-3 align-items-end mb-4">
        <div class="col-md-3">
            <label class="form-label" for="currency">Deviza</label>
            <select class="form-select" id="currency" name="currency" required>
                <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}"
                        th:selected="${c == currency}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="from">Kezdő dátum</label>
            <input type="date" class="form-control" id="from" name="from" th:value="${from}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="to">Befejező dátum</label>
            <input type="date" class="form-control" id="to" name="to" th:value="${to}" required>
        </div>
        <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Lekérdezés</button></div>
    </form>

    <div th:if="${rates != null and !rates.isEmpty()}" class="row g-4">
        <div class="col-lg-5">
            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead><tr><th>Dátum</th><th>Egység</th><th class="text-end">Árfolyam (HUF)</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${rates}">
                        <td th:text="${r.date}"></td>
                        <td th:text="${r.unit}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(r.value, 1, 'WHITESPACE', 2, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-7"><canvas id="chart" height="140"></canvas></div>
    </div>
    <div class="alert alert-info" th:if="${rates != null and rates.isEmpty()}">
        Erre az időszakra nincs adat (hétvége vagy ünnepnap?).
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script th:inline="javascript" th:if="${rates != null and !rates.isEmpty()}">
    const labels = /*[[${labels}]]*/ [];
    const values = /*[[${values}]]*/ [];
    const cur = /*[[${currency}]]*/ '';
    new Chart(document.getElementById('chart'), {
        type: 'line',
        data: { labels: labels, datasets: [{ label: cur + ' / HUF', data: values, tension: 0.2, fill: false }] },
        options: { responsive: true }
    });
</script>
</body>
</html>
